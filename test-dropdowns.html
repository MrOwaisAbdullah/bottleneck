<!DOCTYPE html>
<html>
<head>
    <title>Test Dropdowns</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select {
            width: 300px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Test Dropdowns Population</h1>
    
    <div class="form-group">
        <label for="cpu">CPU:</label>
        <select id="cpu">
            <option value="">Select a CPU</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="gpu">GPU:</label>
        <select id="gpu">
            <option value="">Select a GPU</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="game">Game:</label>
        <select id="game">
            <option value="">General Gaming</option>
        </select>
    </div>
    
    <!-- Load external data file -->
    <script src="data.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, populating dropdowns...');
            
            // Get DOM elements
            const cpuSelect = document.getElementById('cpu');
            const gpuSelect = document.getElementById('gpu');
            const gameSelect = document.getElementById('game');
            
            if (window.components) {
                console.log('Components found, populating dropdowns...');
                
                // Populate CPUs
                window.components.cpus.forEach(cpu => {
                    const option = document.createElement('option');
                    option.value = cpu.id;
                    option.textContent = `${cpu.name} (Rank: ${cpu.rank})`;
                    cpuSelect.appendChild(option);
                });
                console.log('CPU dropdown populated with', window.components.cpus.length, 'items');
                
                // Populate GPUs
                window.components.gpus.forEach(gpu => {
                    const option = document.createElement('option');
                    option.value = gpu.id;
                    option.textContent = `${gpu.name} (Rank: ${gpu.rank})`;
                    gpuSelect.appendChild(option);
                });
                console.log('GPU dropdown populated with', window.components.gpus.length, 'items');
                
                // Populate Games
                window.components.games.forEach(game => {
                    const option = document.createElement('option');
                    option.value = game.id;
                    option.textContent = game.name;
                    gameSelect.appendChild(option);
                });
                console.log('Game dropdown populated with', window.components.games.length, 'items');
                
                document.body.innerHTML += '<p style="color: green; font-size: 18px;">✓ All dropdowns populated successfully! Check the dropdowns above.</p>';
            } else {
                console.error('Components not found');
                document.body.innerHTML += '<p style="color: red; font-size: 18px;">✗ Error: Components data not loaded!</p>';
            }
        });
    </script>
</body>
</html>
