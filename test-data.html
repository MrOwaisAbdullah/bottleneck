<!DOCTYPE html>
<html>
<head>
    <title>Test Data Loading</title>
</head>
<body>
    <h1>Test Data Loading</h1>
    <p>Check the console for data loading results.</p>
    
    <!-- Load external data file -->
    <script src="data.js"></script>
    
    <script>
        // Test if components are loaded
        console.log('Components loaded:', window.components);
        
        if (window.components) {
            console.log('CPUs count:', window.components.cpus.length);
            console.log('GPUs count:', window.components.gpus.length);
            console.log('Games count:', window.components.games.length);
            
            // Check if new components are present
            const newCPU = window.components.cpus.find(cpu => cpu.id === "ryzen-9-9950x3d");
            const newGPU = window.components.gpus.find(gpu => gpu.id === "rtx-5090");
            
            if (newCPU) {
                console.log('New CPU found:', newCPU.name);
            } else {
                console.log('New CPU not found');
            }
            
            if (newGPU) {
                console.log('New GPU found:', newGPU.name);
            } else {
                console.log('New GPU not found');
            }
            
            document.body.innerHTML += '<p style="color: green;">Data loaded successfully! Check console for details.</p>';
        } else {
            console.error('Components not loaded');
            document.body.innerHTML += '<p style="color: red;">Data loading failed!</p>';
        }
    </script>
</body>
</html>
