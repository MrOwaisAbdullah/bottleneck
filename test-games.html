<!DOCTYPE html>
<html>
<head>
    <title>Test Games Data Loading</title>
</head>
<body>
    <h1>Test Games Data Loading</h1>
    <p>Check the console for data loading results.</p>
    
    <!-- Load external data file -->
    <script src="data.js"></script>
    
    <script>
        // Test if components are loaded
        console.log('Components loaded:', window.components);
        
        if (window.components) {
            console.log('CPUs count:', window.components.cpus.length);
            console.log('GPUs count:', window.components.gpus.length);
            console.log('Games count:', window.components.games.length);
            
            // Display all games
            console.log('Games list:');
            window.components.games.forEach(game => {
                console.log(`- ${game.name} (ID: ${game.id})`);
            });
            
            // Check if new games are present
            const newGames = [
                "starfield",
                "black-myth-wukong",
                "cod-black-ops-6"
            ];
            
            newGames.forEach(gameId => {
                const game = window.components.games.find(g => g.id === gameId);
                if (game) {
                    console.log(`✓ New game found: ${game.name}`);
                } else {
                    console.log(`✗ New game not found: ${gameId}`);
                }
            });
            
            document.body.innerHTML += '<p style="color: green;">Data loaded successfully! Check console for details.</p>';
            document.body.innerHTML += '<p>Games loaded: ' + window.components.games.length + '</p>';
        } else {
            console.error('Components not loaded');
            document.body.innerHTML += '<p style="color: red;">Data loading failed!</p>';
        }
    </script>
</body>
</html>
